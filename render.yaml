services:
  - type: web
    name: daylyplaner
    runtime: docker
    repo: https://github.com/ilikecinepol/daylyPlaner
    branch: master
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: daylyplaner-db
          property: connectionString

databases:
  - name: daylyplaner-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: daylyplaner
    user: daylyplaner
    ipAllowList: []
