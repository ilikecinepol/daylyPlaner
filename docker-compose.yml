services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
    volumes:
      - planner_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://planner:planner@db:5432/planner
      SECRET_KEY: change-this-secret
    depends_on:
      db:
        condition: service_healthy
volumes:
  planner_data:
