<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f8fb" />
  <link rel="manifest" href="/manifest.webmanifest">
  <title>План — ежедневник</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3.0" />
</head>
<body>
  <div class="auth-screen" id="auth-screen">
    <form class="auth-card" id="auth-form">
      <div class="brand"><span class="brand-mark">П</span><span>план</span></div>
      <h1 id="auth-title">Войти в ежедневник</h1><p>Задачи, календарь и проекты в одном месте.</p>
      <label class="register-only hidden">Имя<input name="name" placeholder="Ваше имя"></label>
      <label class="register-only hidden">Ник в приложении<input name="nickname" placeholder="например, ocean_dev" minlength="3" maxlength="40" pattern="[A-Za-zА-Яа-яЁё0-9_.-]+"></label>
      <label>Email<input name="email" type="email" required autocomplete="email" placeholder="name@example.com"></label>
      <label>Пароль<input name="password" type="password" minlength="8" required autocomplete="current-password" placeholder="Не менее 8 символов"></label>
      <button class="primary wide" id="auth-submit">Войти</button>
      <button type="button" class="secondary wide" id="auth-switch">Нет аккаунта? Зарегистрироваться</button>
      <div class="auth-error" id="auth-error"></div>
    </form>
  </div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark">П</span><span>план</span></div>
    <button class="primary wide" data-action="add"><span>＋</span> Добавить</button>
    <nav id="nav">
      <button class="nav-item active" data-page="today"><span>◉</span> Сегодня <b id="today-count">0</b></button>
      <button class="nav-item" data-page="calendar"><span>▦</span> Календарь</button>
      <button class="nav-item" data-page="tasks"><span>✓</span> Задачи</button>
      <button class="nav-item" data-page="ai"><span>✦</span> AI-помощник</button>
      <button class="nav-item" data-page="goals"><span>◎</span> Цели и задачи</button>
      <button class="nav-item" data-page="projects"><span>◇</span> Проекты</button>
      <button class="nav-item" data-page="team"><span>♯</span> Команда</button>
      <button class="nav-item" data-page="contacts"><span>◎</span> Друзья <b id="friend-request-count" class="hidden">0</b></button>
      <button class="nav-item" data-page="inbox"><span>↓</span> Входящие <b id="inbox-count">0</b></button>
    </nav>
    <div class="side-section"><small>МОИ ПРОЕКТЫ</small><div id="side-projects"></div></div>
    <button class="nav-item settings" data-page="settings"><span>⚙</span> Настройки</button>
  </aside>

  <main>
    <header>
      <button class="icon-btn mobile-menu" id="menu-btn">☰</button>
      <div class="search"><span>⌕</span><input id="search" placeholder="Поиск задач, проектов, тегов…"><kbd>⌘ K</kbd></div>
      <button class="icon-btn hidden" id="friends-alert" title="Новые запросы в друзья">♢</button>
      <button class="icon-btn" id="theme-btn" title="Сменить тему">☼</button>
      <button class="avatar">ДК</button>
    </header>
    <div class="content" id="content"></div>
  </main>

  <button class="fab" data-action="add" aria-label="Добавить задачу">＋</button>
  <div class="modal-backdrop hidden" id="modal">
    <form class="modal" id="task-form">
      <div class="modal-head"><div><span class="eyebrow">НОВАЯ ЗАДАЧА</span><h2>Что нужно сделать?</h2></div><button type="button" class="icon-btn" data-close>×</button></div>
      <input type="hidden" name="id">
      <label>Название<input required autofocus name="title" placeholder="Например, подготовить презентацию"></label>
      <div class="form-grid">
        <label>Дата<input name="date" type="date"></label>
        <label>Начало<input name="time" type="time"></label>
        <label>Окончание<input name="end_time" type="time"></label>
        <label>Длительность<select name="duration"><option value="30">30 минут</option><option value="60" selected>1 час</option><option value="90">1,5 часа</option><option value="120">2 часа</option><option value="180">3 часа</option></select></label>
        <label>Дата дедлайна<input name="deadline_date" type="date"></label>
        <label>Время дедлайна<input name="deadline_time" type="time"><small>Без времени — до конца дня</small></label>
        <label>После дедлайна<select name="deadline_action"><option value="none">Ничего не делать</option><option value="mark_overdue">Отметить просроченной</option><option value="auto_complete">Завершить автоматически</option></select></label>
        <label>Приоритет<select name="priority"><option value="P1">Критично</option><option value="P2">Важно</option><option value="P3" selected>Обычно</option><option value="P4">Не очень важно</option></select></label>
        <label>Статус / колонка<select name="workflow"><option value="status:idea">Идеи</option><option value="status:planned" selected>Запланировано</option><option value="status:in_progress">В работе</option><option value="status:completed">Готово</option><option value="status:cancelled">Отменено</option></select></label>
        <label>Цель<select name="goal" id="task-goal"></select><small id="task-goal-why"></small></label>
        <label>Проект<select name="project" id="project-select"></select></label>
        <label>Исполнитель<select name="assignee"><option value="">Не назначен</option></select></label>
      </div>
      <label>Место<input name="location" placeholder="Кабинет, адрес или онлайн"></label>
      <label>Описание<textarea name="description" rows="3" placeholder="Детали, ссылки и заметки"></textarea></label>
      <label>Теги<input name="tags" placeholder="Через запятую"></label>
      <div class="form-grid"><label>Повторение<select name="recurrence"><option value="">Не повторять</option><option value="DAILY">Каждый день</option><option value="WEEKDAYS">По рабочим дням</option><option value="WEEKLY">Каждую неделю</option><option value="MONTHLY">Каждый месяц</option><option value="YEARLY">Каждый год</option></select></label><label>Напоминание<select name="reminder"><option value="">Без напоминания</option><option value="15">За 15 минут</option><option value="30">За 30 минут</option><option value="60">За час</option><option value="1440">За сутки</option></select></label></div>
      <label class="task-template-field">Шаблон<div class="template-choice-row"><select name="template_choice" id="task-template-choice"><option value="">Без шаблона</option><option value="__create__">Создать новый…</option></select><button type="button" class="secondary hidden" id="edit-template">Редактировать</button><button type="button" class="danger hidden" id="delete-template">Удалить</button></div><small>Шаблон сохраняет все заполненные параметры карточки</small></label>
      <div class="modal-actions"><button type="button" class="danger hidden" id="delete-task">Удалить</button><span class="spacer"></span><button type="button" class="secondary" data-close>Отмена</button><button class="primary">Сохранить задачу</button></div>
    </form>
  </div>
  <div class="modal-backdrop hidden" id="ui-modal">
    <form class="modal" id="ui-form">
      <div class="modal-head"><div><span class="eyebrow">НАСТРОЙКА</span><h2 id="ui-title"></h2></div><button type="button" class="icon-btn" data-ui-close>×</button></div>
      <div id="ui-fields"></div>
      <div class="modal-actions"><button type="button" class="secondary" data-ui-close>Отмена</button><button class="primary" id="ui-submit">Сохранить</button></div>
    </form>
  </div>
  <div id="toast"></div>
  <script type="module" src="app.js?v=6.7"></script>
  <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js')</script>
</body>
</html>
